[tool.poetry]
name = "memos-mcp"
version = "0.1.0"
description = "A FastMCP server for MemOS"
authors = ["SigmaDev11 <steynsean11@gmail.com>"]
readme = "README.md"
packages = [{include = "memos_mcp", from = "src"}]

[tool.poetry.dependencies]
# Core Dependencies
python = ">=3.12,<3.13"
fastmcp = "^2.0.0"
fastapi = ">=0.100.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
neo4j = ">=6.0.0,<7.0.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
asyncpg = "^0.30.0"
pgvector = "^0.3.0"
httpx = ">=0.28.0"
uvicorn = ">=0.23.0"
PyJWT = "^2.0.0"
PyYAML = "^6.0.0"
python-multipart = "^0.0.6"
langfuse = "^3.3.0"

[tool.poetry.group.dev.dependencies]
# Development Dependencies
ruff = "^0.1.0"
pytest = "^7.0.0"
pytest-asyncio = ">=0.23.0"
mypy = "^1.0.0"
pre-commit = "^3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "src"
