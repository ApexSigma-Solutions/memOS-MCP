[project]
name = "memos-mcp"
version = "0.1.0"
description = "A FastMCP server for MemOS"
authors = [
    {name = "SigmaDev11",email = "steynsean11@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ruff (>=0.1.0,<0.2.0)",
    "mypy (>=1.0.0,<2.0.0)",
    "pytest (>=7.0.0,<8.0.0)",
    "pytest-asyncio (>=0.21.0,<1.0.0)",
    "pre-commit (>=3.0.0,<4.0.0)",
    "fastmcp",
    "sqlalchemy",
    "psycopg2-binary",
    "neo4j",
    "pydantic",
    "pydantic-settings",
    "httpx (>=0.25.0,<1.0.0)",
    "uvicorn (>=0.20.0,<1.0.0)",
    "PyJWT (>=2.0.0,<3.0.0)",
    "python-multipart (>=0.0.6,<1.0.0)",
    "langfuse (>=3.3.0,<4.0.0)",
    "qdrant-client"
]

[tool.poetry]
packages = [{include = "memos_mcp", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
